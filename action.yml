name: Verify byte-identical builds with ReproBit
description: Run a cold build, verify its authenticity, and publish reports

inputs:
  project-directory:
    description: Project directory containing reprobit.toml
    default: .
  toolchain-root:
    description: Path to the already-provisioned local toolchain
    required: true
  compiler-transport:
    description: Locked Wine launcher for the compiler on macOS or Linux; empty on Windows
    default: ""
  resource-transport:
    description: Locked Wine launcher for the resource compiler on macOS or Linux; empty on Windows
    default: ""
  jobs:
    description: Maximum number of build steps to run at once
    default: "4"
  policy:
    description: Optional narrowing override; clean may narrow allow-quarantine but never broaden it
    default: ""
  initialization-timeout:
    description: Seconds allowed to prepare each isolated build lane
    default: "600"
  compile-timeout:
    description: Seconds allowed for each compiler or resource-compiler process
    default: "600"
  link-timeout:
    description: Seconds allowed for each librarian or linker process
    default: "900"
  cleanup-timeout:
    description: Seconds allowed to stop and drain each isolated build lane
    default: "10"
  report-directory:
    description: Report directory relative to the project
    default: build/reprobit-report

outputs:
  report-produced:
    description: Whether this run published and validated its canonical reports
    value: ${{ steps.summary.outputs.report-produced }}
  accepted:
    description: Whether this run met the selected policy
    value: ${{ steps.summary.outputs.accepted }}
  clean:
    description: Whether every clean authenticity claim passed
    value: ${{ steps.summary.outputs.clean }}
  byte-exact:
    description: Whether every selected candidate matched its reference bytes
    value: ${{ steps.summary.outputs.byte-exact }}
  logic-certified:
    description: Whether every intervention passed its required checks
    value: ${{ steps.summary.outputs.logic-certified }}
  toolchain-origin:
    description: Whether first-party program bytes came from the declared toolchain
    value: ${{ steps.summary.outputs.toolchain-origin }}
  quarantined:
    description: Whether an allowlisted reference-byte exception ran
    value: ${{ steps.summary.outputs.quarantined }}
  quarantine-count:
    description: Number of declared reference-byte exceptions used by this run
    value: ${{ steps.summary.outputs.quarantine-count }}
  quarantine-bytes:
    description: Total number of reference bytes covered by declared exceptions
    value: ${{ steps.summary.outputs.quarantine-bytes }}
  quarantine-ranges:
    description: Total number of artifact ranges covered by declared exceptions
    value: ${{ steps.summary.outputs.quarantine-ranges }}
  quarantine-digest:
    description: SHA-256 identity of the canonical declared exception set
    value: ${{ steps.summary.outputs.quarantine-digest }}
  total-cost:
    description: Total intervention cost for the selected targets
    value: ${{ steps.summary.outputs.total-cost }}
  report-json:
    description: Path to the canonical JSON report
    value: ${{ steps.summary.outputs.report-json }}
  report-html:
    description: Path to the self-contained HTML report
    value: ${{ steps.summary.outputs.report-html }}

runs:
  using: composite
  steps:
    - name: Install this checked-out ReproBit Action
      shell: bash
      env:
        REPROBIT_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$REPROBIT_ACTION_PATH"

    - name: Create a fresh-run receipt
      id: invocation
      shell: bash
      run: |
        set -euo pipefail
        nonce="$(python -c 'import secrets; print(secrets.token_hex(32))')"
        receipt="$RUNNER_TEMP/reprobit-action-$nonce.json"
        printf 'nonce=%s\n' "$nonce" >> "$GITHUB_OUTPUT"
        printf 'receipt=%s\n' "$receipt" >> "$GITHUB_OUTPUT"

    - name: Verify the backend and toolchain
      shell: bash
      working-directory: ${{ inputs.project-directory }}
      env:
        REPROBIT_TOOLCHAIN_ROOT: ${{ inputs.toolchain-root }}
      run: >-
        rbit doctor
        --toolchain-root "$REPROBIT_TOOLCHAIN_ROOT"
        --execute-probe

    - name: Build cold, verify, and write reports
      id: verification
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.project-directory }}
      env:
        REPROBIT_TOOLCHAIN_ROOT: ${{ inputs.toolchain-root }}
        REPROBIT_COMPILER_TRANSPORT: ${{ inputs.compiler-transport }}
        REPROBIT_RESOURCE_TRANSPORT: ${{ inputs.resource-transport }}
        REPROBIT_JOBS: ${{ inputs.jobs }}
        REPROBIT_POLICY: ${{ inputs.policy }}
        REPROBIT_REPORT_DIRECTORY: ${{ inputs.report-directory }}
        REPROBIT_INITIALIZATION_TIMEOUT: ${{ inputs.initialization-timeout }}
        REPROBIT_COMPILE_TIMEOUT: ${{ inputs.compile-timeout }}
        REPROBIT_LINK_TIMEOUT: ${{ inputs.link-timeout }}
        REPROBIT_CLEANUP_TIMEOUT: ${{ inputs.cleanup-timeout }}
        REPROBIT_ACTION_NONCE: ${{ steps.invocation.outputs.nonce }}
        REPROBIT_ACTION_RECEIPT: ${{ steps.invocation.outputs.receipt }}
      run: |
        set -euo pipefail
        transport_args=()
        policy_args=()
        if [[ -n "$REPROBIT_COMPILER_TRANSPORT" || -n "$REPROBIT_RESOURCE_TRANSPORT" ]]; then
          if [[ -z "$REPROBIT_COMPILER_TRANSPORT" || -z "$REPROBIT_RESOURCE_TRANSPORT" ]]; then
            echo "compiler-transport and resource-transport must be supplied together" >&2
            exit 2
          fi
          transport_args+=(
            --compiler-transport "$REPROBIT_COMPILER_TRANSPORT"
            --resource-transport "$REPROBIT_RESOURCE_TRANSPORT"
          )
        fi
        if [[ -n "$REPROBIT_POLICY" ]]; then
          policy_args+=(--policy "$REPROBIT_POLICY")
        fi
        rbit verify \
          --toolchain-root "$REPROBIT_TOOLCHAIN_ROOT" \
          --jobs "$REPROBIT_JOBS" \
          --initialization-timeout "$REPROBIT_INITIALIZATION_TIMEOUT" \
          --compile-timeout "$REPROBIT_COMPILE_TIMEOUT" \
          --link-timeout "$REPROBIT_LINK_TIMEOUT" \
          --cleanup-timeout "$REPROBIT_CLEANUP_TIMEOUT" \
          --report-dir "$REPROBIT_REPORT_DIRECTORY" \
          --action-receipt "$REPROBIT_ACTION_RECEIPT" \
          --action-nonce "$REPROBIT_ACTION_NONCE" \
          "${policy_args[@]}" \
          "${transport_args[@]}"

    - name: Publish verified outputs and the job summary
      id: summary
      if: always()
      shell: bash
      working-directory: ${{ inputs.project-directory }}
      env:
        REPROBIT_ACCEPTED: ${{ steps.verification.outcome == 'success' }}
        REPROBIT_REPORT_DIRECTORY: ${{ inputs.report-directory }}
        REPROBIT_ACTION_NONCE: ${{ steps.invocation.outputs.nonce }}
        REPROBIT_ACTION_RECEIPT: ${{ steps.invocation.outputs.receipt }}
      run: >-
        python -m reprobit.action_summary
        --allow-missing
        --receipt "$REPROBIT_ACTION_RECEIPT"
        --nonce "$REPROBIT_ACTION_NONCE"
        "$REPROBIT_REPORT_DIRECTORY/report.json"

    - name: Fail the job when verification failed
      if: always() && steps.verification.outcome == 'failure'
      shell: bash
      run: exit 1
