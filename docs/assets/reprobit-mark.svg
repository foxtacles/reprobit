<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">ReproBit dotted R</title>
  <desc id="description">A bold cyan and violet letter R with three precise bit dots inside its bowl.</desc>

  <defs>
    <path
      id="r-body"
      d="M104 72h174c91 0 144 50 144 132s-53 132-144 132h-70v104H104V72Zm104 96v72h68c31 0 46-12 46-36s-15-36-46-36h-68Z"
      fill-rule="evenodd"
    />
    <path id="r-leg" d="m284 310 124 110"/>
  </defs>

  <!-- Dual keylines preserve the transparent mark on light and dark surfaces. -->
  <use href="#r-leg" fill="none" stroke="#f8fafc" stroke-width="126" stroke-linecap="round"/>
  <use href="#r-leg" fill="none" stroke="#0f172a" stroke-width="108" stroke-linecap="round"/>
  <use href="#r-leg" fill="none" stroke="#8b5cf6" stroke-width="78" stroke-linecap="round"/>

  <use href="#r-body" fill="#22d3ee" stroke="#f8fafc" stroke-width="44" stroke-linejoin="round" paint-order="stroke fill"/>
  <use href="#r-body" fill="#22d3ee" stroke="#0f172a" stroke-width="26" stroke-linejoin="round" paint-order="stroke fill"/>

  <g fill="#0f172a">
    <circle cx="230" cy="204" r="18"/>
    <circle cx="265" cy="204" r="18"/>
    <circle cx="300" cy="204" r="18"/>
  </g>
  <g fill="#f8fafc">
    <circle cx="230" cy="204" r="10"/>
    <circle cx="265" cy="204" r="10"/>
    <circle cx="300" cy="204" r="10"/>
  </g>
</svg>
