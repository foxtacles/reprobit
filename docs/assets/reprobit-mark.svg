<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">ReproBit byte seal</title>
  <desc id="description">A split eight-punch seal aligned around one exact square bit.</desc>

  <rect x="24" y="24" width="464" height="464" rx="112" fill="#101828"/>

  <!-- Reference and rebuild share one precise, eight-bit silhouette. -->
  <path d="M176 76h80v360h-80L76 336V176L176 76Z" fill="#22d3ee"/>
  <path d="M256 76h80l100 100v160L336 436h-80V76Z" fill="#a78bfa"/>

  <g fill="#101828">
    <circle cx="176" cy="176" r="24"/>
    <circle cx="256" cy="148" r="24"/>
    <circle cx="336" cy="176" r="24"/>
    <circle cx="364" cy="256" r="24"/>
    <circle cx="336" cy="336" r="24"/>
    <circle cx="256" cy="364" r="24"/>
    <circle cx="176" cy="336" r="24"/>
    <circle cx="148" cy="256" r="24"/>
  </g>

  <rect x="214" y="214" width="84" height="84" rx="18" fill="#f8fafc"/>
  <rect x="238" y="238" width="36" height="36" rx="7" fill="#101828"/>
</svg>
