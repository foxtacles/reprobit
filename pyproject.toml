[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "reprobit"
version = "0.1.0.dev0"
description = "Proof-carrying reproduction of byte-identical compiler output"
readme = "README.md"
requires-python = ">=3.11"
license = "LGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "pydantic>=2.12,<3",
  "rich>=13.9,<15",
]

[project.optional-dependencies]
test = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
rbit = "reprobit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reprobit"]

[tool.hatch.build.targets.wheel.force-include]
"cmake" = "share/reprobit/cmake"
"runtime" = "share/reprobit/runtime"
"schemas" = "share/reprobit/schemas"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "msvc42: needs an authenticated MSVC 4.2 installation (REPROBIT_MSVC_4_2_ROOT)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# The classic core is a mechanically extracted, byte-sensitive implementation.
# Keep its grandfathered diagnostics explicit by module and rule instead of
# hiding all present and future diagnostics with file-wide noqa directives.
[tool.ruff.lint.per-file-ignores]
"src/reprobit/classic/arguments.py" = ["E501"]
"src/reprobit/classic/composition.py" = ["B905", "E501"]
"src/reprobit/classic/composition_hybrid_resize.py" = ["B905", "E501"]
"src/reprobit/classic/composition_mosaic.py" = ["B905", "E501"]
"src/reprobit/classic/composition_relocations.py" = ["B905", "E501"]
"src/reprobit/classic/composition_same_slot.py" = ["B905", "E501"]
"src/reprobit/classic/debug.py" = ["E501"]
"src/reprobit/classic/floating.py" = ["B023", "E501"]
"src/reprobit/classic/foundation.py" = ["B905"]
"src/reprobit/classic/ia32.py" = ["B905", "E501"]
"src/reprobit/classic/register_bijection.py" = ["B905", "E501"]
"src/reprobit/classic/register_candidates.py" = ["B905", "E501"]
"src/reprobit/classic/register_reencoding.py" = ["B905", "E501"]
"src/reprobit/classic/register_semantics.py" = ["E501"]
"src/reprobit/classic/relational.py" = ["B905", "E501"]
"src/reprobit/classic/rewriting.py" = ["B905", "E501"]
"src/reprobit/classic/rewriting_exchanges.py" = ["B023", "B905", "E501"]
"src/reprobit/classic/rewriting_region_simulation.py" = ["B023", "E501"]
"src/reprobit/classic/scheduling_apply.py" = ["B905", "E501"]
"src/reprobit/classic/scheduling_certificates.py" = ["B905", "E501"]
"src/reprobit/classic/scheduling_dependence.py" = ["B905", "E501"]
"src/reprobit/classic/scheduling_web_recolour.py" = ["B905", "E501"]
"src/reprobit/classic/scheduling_webs.py" = ["E501"]
"src/reprobit/classic/source_proofs.py" = ["B905", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["reprobit"]

# These suppressions inventory the pre-existing typing debt in the mechanically
# extracted classic core. Mypy still analyzes every module and rejects any new
# diagnostic category, unlike a file-wide ignore-errors pragma.
[[tool.mypy.overrides]]
module = "reprobit.classic.coff"
disable_error_code = ["arg-type", "index", "no-any-return", "no-untyped-call", "no-untyped-def"]

[[tool.mypy.overrides]]
module = "reprobit.classic.composition"
disable_error_code = ["arg-type", "assignment", "index", "return-value", "var-annotated"]

[[tool.mypy.overrides]]
module = "reprobit.classic.composition_comdat_order"
disable_error_code = ["assignment", "var-annotated"]

[[tool.mypy.overrides]]
module = "reprobit.classic.composition_fpo_identity"
disable_error_code = ["arg-type", "assignment", "attr-defined", "no-any-return", "var-annotated"]

[[tool.mypy.overrides]]
module = "reprobit.classic.composition_hybrid_resize"
disable_error_code = ["arg-type", "assignment", "no-untyped-call", "no-untyped-def"]

[[tool.mypy.overrides]]
module = "reprobit.classic.composition_mosaic"
disable_error_code = [
  "arg-type", "assignment", "index", "no-any-return", "return-value", "var-annotated",
]

[[tool.mypy.overrides]]
module = "reprobit.classic.composition_relocations"
disable_error_code = ["arg-type", "assignment"]

[[tool.mypy.overrides]]
module = "reprobit.classic.composition_same_slot"
disable_error_code = [
  "arg-type", "assignment", "index", "no-untyped-call", "no-untyped-def", "union-attr",
  "var-annotated",
]

[[tool.mypy.overrides]]
module = "reprobit.classic.debug"
disable_error_code = ["arg-type", "var-annotated"]

[[tool.mypy.overrides]]
module = "reprobit.classic.floating"
disable_error_code = [
  "arg-type", "assignment", "index", "no-untyped-call", "no-untyped-def", "return-value",
]

[[tool.mypy.overrides]]
module = "reprobit.classic.foundation"
disable_error_code = [
  "arg-type", "attr-defined", "call-overload", "index", "operator", "return-value",
]

[[tool.mypy.overrides]]
module = "reprobit.classic.ia32"
disable_error_code = [
  "arg-type", "assignment", "attr-defined", "index", "misc", "no-untyped-def", "operator",
  "return-value", "var-annotated",
]

[[tool.mypy.overrides]]
module = "reprobit.classic.register_bijection"
disable_error_code = [
  "arg-type", "assignment", "attr-defined", "call-overload", "index", "no-any-return",
  "return-value", "union-attr", "var-annotated",
]

[[tool.mypy.overrides]]
module = "reprobit.classic.register_candidates"
disable_error_code = ["arg-type", "assignment", "index", "return-value"]

[[tool.mypy.overrides]]
module = "reprobit.classic.register_reencoding"
disable_error_code = [
  "arg-type", "assignment", "attr-defined", "dict-item", "index", "no-any-return",
  "no-untyped-def", "operator", "union-attr", "var-annotated",
]

[[tool.mypy.overrides]]
module = "reprobit.classic.register_semantics"
disable_error_code = ["arg-type", "index", "no-untyped-def", "return-value", "var-annotated"]

[[tool.mypy.overrides]]
module = "reprobit.classic.relational"
disable_error_code = [
  "arg-type", "assignment", "attr-defined", "call-overload", "operator", "return-value",
  "type-var", "var-annotated",
]

[[tool.mypy.overrides]]
module = "reprobit.classic.rewriting"
disable_error_code = ["arg-type", "assignment", "call-overload", "index", "var-annotated"]

[[tool.mypy.overrides]]
module = "reprobit.classic.rewriting_certificates"
disable_error_code = [
  "arg-type", "attr-defined", "call-overload", "index", "operator", "var-annotated",
]

[[tool.mypy.overrides]]
module = "reprobit.classic.rewriting_exchanges"
disable_error_code = [
  "arg-type", "assignment", "index", "no-untyped-call", "no-untyped-def", "return-value",
]

[[tool.mypy.overrides]]
module = "reprobit.classic.rewriting_region_simulation"
disable_error_code = [
  "arg-type", "assignment", "index", "misc", "no-untyped-call", "no-untyped-def", "operator",
  "return-value", "var-annotated",
]

[[tool.mypy.overrides]]
module = "reprobit.classic.scheduling"
disable_error_code = [
  "arg-type", "assignment", "call-overload", "misc", "no-untyped-call", "no-untyped-def",
]

[[tool.mypy.overrides]]
module = "reprobit.classic.scheduling_apply"
disable_error_code = [
  "arg-type", "assignment", "index", "misc", "no-untyped-call", "no-untyped-def", "return-value",
  "union-attr",
]

[[tool.mypy.overrides]]
module = "reprobit.classic.scheduling_certificates"
disable_error_code = ["arg-type", "attr-defined", "index", "no-untyped-call", "no-untyped-def"]

[[tool.mypy.overrides]]
module = "reprobit.classic.scheduling_dependence"
disable_error_code = [
  "arg-type", "index", "no-any-return", "no-untyped-call", "no-untyped-def", "union-attr",
]

[[tool.mypy.overrides]]
module = "reprobit.classic.scheduling_web_recolour"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "reprobit.classic.scheduling_webs"
disable_error_code = ["arg-type", "union-attr", "var-annotated"]

[[tool.mypy.overrides]]
module = "reprobit.classic.source_proofs"
disable_error_code = ["arg-type", "assignment", "operator"]
