name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Never cancel an in-flight main build: every main commit must be fully
# verified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-2022]
        python: ["3.11", "3.14"]
        exclude:
          - os: windows-2022
            python: "3.11"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest

  lowest-bounds:
    name: Lowest dependency bounds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install with minimum resolvable dependency versions
        run: |
          python -m pip install uv
          uv pip install --system --resolution lowest-direct -e ".[test]"
      - run: python -m pytest

  quality:
    name: Static checks and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install build -e ".[test]"
      - run: python -m pip check
      - name: Validate composite Action YAML
        run: >-
          ruby -e 'require "yaml";
          YAML.safe_load(File.read("action.yml"), aliases: true)'
      - run: python -m ruff format --check src tests
      - run: python -m ruff check src tests
      - run: python -m mypy src/reprobit
      - run: python -m build
      - name: Verify wheel contents and installed CLI
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          rbit --version
          python - <<'PY'
          from importlib.metadata import distribution
          from pathlib import Path
          from reprobit.assets import runtime_asset_path
          from reprobit.cmake import cmake_module_path

          cmake_module = cmake_module_path() / "ReproBit.cmake"
          runtime_proxy = runtime_asset_path("ReproBitPathProxy.sh")
          for path in (cmake_module, runtime_proxy):
              if not path.is_file():
                  raise SystemExit(f"wheel omitted {path}")
          installed = distribution("reprobit")
          files = {str(item) for item in installed.files or ()}
          license_root = f"reprobit-{installed.version}.dist-info/licenses"
          required = {
              "reprobit/py.typed",
              f"{license_root}/LICENSE",
              f"{license_root}/NOTICE",
          }
          for directory in ("cmake", "runtime", "schemas"):
              required.update(
                  f"share/reprobit/{path.as_posix()}"
                  for path in Path(directory).rglob("*")
                  if path.is_file()
              )
          if missing := sorted(required - files):
              raise SystemExit(f"wheel omitted {missing}")
          PY

  wine-msvc42:
    name: Wine / authenticated MSVC 4.2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install 32-bit Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine32:i386
          wine --version
          command -v wineserver
      - run: python -m pip install -e ".[test]"
      - name: Provision and authenticate the external compiler
        run: >-
          rbit toolchain provision
          --destination "$RUNNER_TEMP/archaic-msvc42"
          --no-save
      - name: Probe the Wine transport and toolchain
        run: >-
          rbit doctor
          --toolchain-profile msvc_4_2
          --toolchain-root "$RUNNER_TEMP/archaic-msvc42"
          --execute-probe
      - name: Run the full suite with the authenticated compiler
        env:
          REPROBIT_MSVC_4_2_ROOT: ${{ runner.temp }}/archaic-msvc42
        run: python -m pytest -q --junitxml="$RUNNER_TEMP/wine-tests.xml"
      - name: Upload Wine diagnostics only
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wine-msvc42-diagnostics
          path: |
            ${{ runner.temp }}/wine-tests.xml
          if-no-files-found: warn
          retention-days: 7

  native-msvc42:
    name: Native Windows / authenticated MSVC 4.2
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Configure native temporary paths
        shell: pwsh
        run: |
          "REPROBIT_MSVC_4_2_ROOT=$env:RUNNER_TEMP\archaic-msvc42" >> $env:GITHUB_ENV
          "REPROBIT_NATIVE_LOG_DIR=$env:RUNNER_TEMP\native-logs" >> $env:GITHUB_ENV
      - name: Record native runner identity
        shell: pwsh
        run: |
          "ImageOS=$env:ImageOS" | Tee-Object -FilePath "$env:RUNNER_TEMP\native-runner.txt"
          "ImageVersion=$env:ImageVersion" | Tee-Object -Append "$env:RUNNER_TEMP\native-runner.txt"
          "Windows=$([Environment]::OSVersion.VersionString)" | Tee-Object -Append "$env:RUNNER_TEMP\native-runner.txt"
          python -c "import platform, struct; print(f'Python={platform.python_version()} ({struct.calcsize(chr(80))*8}-bit)')" |
            Tee-Object -Append "$env:RUNNER_TEMP\native-runner.txt"
      - run: python -m pip install -e ".[test]"
      - name: Provision and authenticate the external compiler
        run: >-
          rbit toolchain provision
          --destination "$env:REPROBIT_MSVC_4_2_ROOT"
          --no-save
      - name: Probe native isolation and toolchain
        run: >-
          rbit doctor
          --backend windows_native_v1
          --toolchain-profile msvc_4_2
          --toolchain-root "$env:REPROBIT_MSVC_4_2_ROOT"
          --execute-probe
      - name: Run the full suite with the authenticated compiler
        run: >-
          python -m pytest -q
          --junitxml="$env:RUNNER_TEMP\native-tests.xml"
          --ignore=tests/test_msvc_grind_integration.py
      - name: Run the project-wide grind sample end to end
        run: >-
          python -m pytest -q
          --junitxml="$env:RUNNER_TEMP\grind-tests.xml"
          tests/test_msvc_grind_integration.py
      - name: Upload native diagnostics only
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-msvc42-diagnostics
          path: |
            ${{ runner.temp }}/native-runner.txt
            ${{ runner.temp }}/native-tests.xml
            ${{ runner.temp }}/grind-tests.xml
            ${{ runner.temp }}/native-logs/*.log
          if-no-files-found: warn
          retention-days: 7
