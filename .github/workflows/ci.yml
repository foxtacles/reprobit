name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Never cancel an in-flight main build: every main commit must be fully
# verified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-2022]
        python: ["3.11", "3.14"]
        exclude:
          - os: windows-2022
            python: "3.11"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - name: Check native Windows file boundaries
        if: runner.os == 'Windows'
        run: >-
          python -m pytest -q -x
          tests/test_windows_metadata_contract.py
          tests/test_windows_promotion.py
          tests/test_exact_tree_windows_move.py
          tests/test_secure_paths_windows.py
          tests/test_state.py
          tests/test_transactions.py
      - run: python -m pytest

  lowest-bounds:
    name: Lowest dependency bounds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install with minimum resolvable dependency versions
        run: |
          python -m pip install uv
          uv pip install --system --resolution lowest-direct -e ".[test]"
      - run: python -m pytest

  quality:
    name: Static checks and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install build -e ".[test]"
      - run: python -m pip check
      - name: Validate composite Action YAML
        run: >-
          ruby -e 'require "yaml";
          YAML.safe_load(File.read("action.yml"), aliases: true)'
      - run: python -m ruff format --check src tests scripts
      - run: python -m ruff check src tests scripts
      - run: python -m mypy src/reprobit scripts
      - run: python -m build
      - name: Verify wheel contents and installed CLI
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          rbit --version
          python scripts/check_wheel.py

  wine-msvc42:
    name: Wine / authenticated MSVC 4.2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install 32-bit Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine32:i386
          wine --version
          command -v wineserver
      - run: python -m pip install -e ".[test]"
      # The authenticated MSVC 4.2 tree is cached between runs. The key covers
      # every pin the provisioner authenticates against (file and tree
      # authorities, the archaic-msvc revisions, the transport assets), so a
      # changed pin never meets a stale tree; on a hit, `rbit toolchain
      # provision` re-authenticates every admitted file before anything uses
      # it. Bump the v1 prefix to discard a cache entry by hand.
      - name: Restore the authenticated compiler
        id: msvc42-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/archaic-msvc42
          key: msvc42-v1-${{ runner.os }}-${{ hashFiles('src/reprobit/msvc42_provision.py', 'src/reprobit/toolchains.py', 'runtime/**') }}
      - name: Provision and authenticate the external compiler
        run: >-
          rbit toolchain provision
          --destination "$RUNNER_TEMP/archaic-msvc42"
          --no-save
      - name: Save the authenticated compiler
        if: steps.msvc42-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/archaic-msvc42
          key: ${{ steps.msvc42-cache.outputs.cache-primary-key }}
      - name: Probe the Wine transport and toolchain
        run: >-
          rbit doctor
          --profile msvc_4_2
          --toolchain-root "$RUNNER_TEMP/archaic-msvc42"
          --execute-probe
      - name: Run the full suite with the authenticated compiler
        env:
          REPROBIT_MSVC_4_2_ROOT: ${{ runner.temp }}/archaic-msvc42
        run: python -m pytest -q --junitxml="$RUNNER_TEMP/wine-tests.xml"
      - name: Upload Wine diagnostics only
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wine-msvc42-diagnostics
          path: |
            ${{ runner.temp }}/wine-tests.xml
          if-no-files-found: warn
          retention-days: 7

  native-msvc42:
    name: Native Windows / authenticated MSVC 4.2
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Configure native temporary paths
        shell: pwsh
        run: |
          "REPROBIT_MSVC_4_2_ROOT=$env:RUNNER_TEMP\archaic-msvc42" >> $env:GITHUB_ENV
          "REPROBIT_NATIVE_LOG_DIR=$env:RUNNER_TEMP\native-logs" >> $env:GITHUB_ENV
      - name: Record native runner identity
        shell: pwsh
        run: |
          "ImageOS=$env:ImageOS" | Tee-Object -FilePath "$env:RUNNER_TEMP\native-runner.txt"
          "ImageVersion=$env:ImageVersion" | Tee-Object -Append "$env:RUNNER_TEMP\native-runner.txt"
          "Windows=$([Environment]::OSVersion.VersionString)" | Tee-Object -Append "$env:RUNNER_TEMP\native-runner.txt"
          python -c "import platform, struct; print(f'Python={platform.python_version()} ({struct.calcsize(chr(80))*8}-bit)')" |
            Tee-Object -Append "$env:RUNNER_TEMP\native-runner.txt"
      - run: python -m pip install -e ".[test]"
      # The authenticated MSVC 4.2 tree is cached between runs. The key covers
      # every pin the provisioner authenticates against (file and tree
      # authorities, the archaic-msvc revisions, the transport assets), so a
      # changed pin never meets a stale tree; on a hit, `rbit toolchain
      # provision` re-authenticates every admitted file before anything uses
      # it. Bump the v1 prefix to discard a cache entry by hand.
      - name: Restore the authenticated compiler
        id: msvc42-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/archaic-msvc42
          key: msvc42-v1-${{ runner.os }}-${{ hashFiles('src/reprobit/msvc42_provision.py', 'src/reprobit/toolchains.py', 'runtime/**') }}
      - name: Provision and authenticate the external compiler
        run: >-
          rbit toolchain provision
          --destination "$env:REPROBIT_MSVC_4_2_ROOT"
          --no-save
      - name: Save the authenticated compiler
        if: steps.msvc42-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/archaic-msvc42
          key: ${{ steps.msvc42-cache.outputs.cache-primary-key }}
      - name: Probe native isolation and toolchain
        run: >-
          rbit doctor
          --backend windows_native_v1
          --profile msvc_4_2
          --toolchain-root "$env:REPROBIT_MSVC_4_2_ROOT"
          --execute-probe
      - name: Check native Windows file boundaries
        run: >-
          python -m pytest -q -x
          tests/test_windows_metadata_contract.py
          tests/test_windows_promotion.py
          tests/test_exact_tree_windows_move.py
          tests/test_secure_paths_windows.py
          tests/test_state.py
          tests/test_transactions.py
      - name: Run the full suite with the authenticated compiler
        run: >-
          python -m pytest -q
          --junitxml="$env:RUNNER_TEMP\native-tests.xml"
          --ignore=tests/test_msvc_grind_integration.py
          --ignore=tests/test_msvc_repair_integration.py
      - name: Run the project-wide grind samples end to end
        run: >-
          python -m pytest -q
          --junitxml="$env:RUNNER_TEMP\grind-tests.xml"
          tests/test_msvc_grind_integration.py
      - name: Run the shared-header repair sample end to end
        run: >-
          python -m pytest -q
          --junitxml="$env:RUNNER_TEMP\repair-tests.xml"
          tests/test_msvc_repair_integration.py
      - name: Upload native diagnostics only
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-msvc42-diagnostics
          path: |
            ${{ runner.temp }}/native-runner.txt
            ${{ runner.temp }}/native-tests.xml
            ${{ runner.temp }}/grind-tests.xml
            ${{ runner.temp }}/repair-tests.xml
            ${{ runner.temp }}/native-logs/*.log
          if-no-files-found: warn
          retention-days: 7

  release:
    name: GitHub release
    # A tag push runs every job above; the release is cut only when all of
    # them pass. Nothing is published to PyPI: the repository holds no PyPI
    # credentials, so the release carries the sdist and wheel as assets.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, lowest-bounds, quality, wine-msvc42, native-msvc42]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install build -e "."
      - name: Check that the tag names the packaged version
        run: python scripts/check_release_tag.py "$GITHUB_REF_NAME"
      - run: python -m build
      - name: Verify wheel contents and installed CLI
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          rbit --version
          python scripts/check_wheel.py
      - name: Publish the release with the sdist and wheel attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes
          dist/*.tar.gz dist/*.whl
